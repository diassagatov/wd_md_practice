services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bounty-net

  db:
    image: postgres:15-alpine
    env_file:
      - .env
    volumes:
      - bounty_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    networks:
      - bounty-net

volumes:
  bounty_postgres_data:

networks:
  bounty-net:
